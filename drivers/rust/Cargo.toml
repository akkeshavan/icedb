[workspace]

[package]
name = "icedb-driver"
version = "0.1.0"
edition = "2021"
description = "Native Rust driver for icedb"

[dependencies]
# Embedded engine (for embedded mode)
storage = { path = "../../crates/storage" }
wal = { path = "../../crates/wal" }
txn = { path = "../../crates/txn" }
catalog = { path = "../../crates/catalog" }
sql = { path = "../../crates/sql" }

tokio = { version = "1", features = ["full"] }
thiserror = "1"
parking_lot = "0.12"
log = "0.4"
arrow = "53"

[dev-dependencies]
env_logger = "0.11"
tempfile = "3"
tokio = { version = "1", features = ["full"] }

[features]
default = ["embedded"]
embedded = []
