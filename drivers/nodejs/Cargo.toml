[workspace]

[package]
name = "icedb-nodejs"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
storage = { path = "../../crates/storage" }
wal = { path = "../../crates/wal" }
txn = { path = "../../crates/txn" }
catalog = { path = "../../crates/catalog" }
sql = { path = "../../crates/sql" }
napi = { version = "2", features = ["napi4"] }
napi-derive = "2"
parking_lot = "0.12"

[build-dependencies]
napi-build = "2"
