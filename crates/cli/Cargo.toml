[package]
name = "cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "isql"
path = "src/main.rs"

[dependencies]
storage = { path = "../storage" }
wal = { path = "../wal" }
txn = { path = "../txn" }
catalog = { path = "../catalog" }
sql = { path = "../sql" }
auth = { path = "../auth" }
rustyline = "14"
tabled = "0.16"
thiserror = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
rustls = { version = "0.23", features = ["ring"] }
rustls-pki-types = "1"
rustls-pemfile = "2"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
