[package]
name = "server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "icedb-server"
path = "src/main.rs"

[dependencies]
storage = { path = "../storage" }
wal = { path = "../wal" }
txn = { path = "../txn" }
catalog = { path = "../catalog" }
sql = { path = "../sql" }
auth = { path = "../auth" }
network = { path = "../network" }
tokio = { workspace = true }
tokio-rustls = "0.26"
rustls-pemfile = "2"
rustls-pki-types = "1"
thiserror = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }

[dev-dependencies]
tempfile = "3"
